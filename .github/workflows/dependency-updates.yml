name: Dependency Updates

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  update-go-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Update dependencies (patch/minor)
        run: |
          # A blanket `go get -u ./...` aborts the whole run the first time
          # some module's newest release requires a newer Go than this repo
          # pins (the 1.21 pin is deliberate -- cel-go); go refuses the
          # upgrade and that refusal used to be a weekly red X. Update one
          # module at a time instead: skip exactly the toolchain-floor
          # refusals (warned and summarized), fail on any other error.
          skipped=""
          # -f '{{.Path}}' is load-bearing: bare `go list -m all` prints
          # "PATH VERSION" rows, and word-splitting those would feed version
          # strings to `go get` as module names.
          for mod in $(go list -m -f '{{.Path}}' all | tail -n +2); do
            if ! go get -u "$mod" 2>/tmp/goget.err; then
              # Two refusals are upstream facts an automated bump cannot
              # adopt, not failures: a release that needs a newer Go than
              # the pinned toolchain, and a module that renamed its path
              # (e.g. github.com/google/cel-go -> cel.dev/cel-go, which is
              # a source-tree migration, never an automated bump). Anything
              # else (network, resolution) stays fatal.
              if grep -qE 'requires go >=|but was required as' /tmp/goget.err; then
                echo "::warning::skipping $mod: newest release cannot be auto-adopted on the pinned go 1.21 toolchain (needs newer Go, or the module renamed its path)"
                skipped="$skipped $mod"
              else
                cat /tmp/goget.err >&2
                exit 1
              fi
            fi
          done
          go mod tidy
          if [ -n "$skipped" ]; then
            echo "### Skipped (cannot auto-adopt on go 1.21):${skipped}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests
        run: |
          make assets
          go test -tags debug ./...   # every package, matching ci.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/dependency-updates
          commit-message: "chore(deps): update Go dependencies"
          title: "chore(deps): automated dependency updates"
          body: |
            Automated weekly dependency update.

            - Updated Go module dependencies via `go get -u ./...`
            - Ran `go mod tidy`
            - Ran test suite in debug mode
          labels: dependencies

