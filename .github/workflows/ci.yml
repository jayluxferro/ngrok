name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Generate assets
        run: make assets

      - name: Unit Tests
        run: go test -tags debug ./main/ngrok ./main/ngrokd ./client ./server ./conn ./msg ./proto ./util ./cache ./log ./version ./client/views/web

      - name: Vet
        run: go vet -tags debug ./main/ngrok ./main/ngrokd ./client ./server ./conn ./msg ./proto ./util ./cache ./log ./version ./client/views/web

      - name: Race Tests
        run: go test -race -tags debug ./server ./util ./client/views/web

